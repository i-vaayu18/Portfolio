<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VaaYU — Developer portfolio">
<title>VaaYU — Portfolio</title>

<!-- Keep your existing Font Awesome / Google Font links here if your base
     index already uses them. -->

<style>

/* =========================================================
   VaaYU Portfolio — Inline Premium Animation Layer
   Additive styles: preserves existing layout
========================================================= */

html { scroll-behavior: smooth; }

body {
    overflow-x: hidden;
}

/* Loader */
.page-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: grid;
    place-items: center;
    background: #050505;
    transition: opacity .8s cubic-bezier(.2,.8,.2,1), visibility .8s ease;
}
.page-loader.loaded {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.loader-inner {
    width: min(260px, 80vw);
    text-align: center;
}
.loader-mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 22px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 18px;
    background: linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: loaderMarkIn .8s cubic-bezier(.2,.8,.2,1) both;
}
.loader-mark span { font-size:25px; font-weight:800; }
.loader-name {
    font-size:19px;
    font-weight:800;
    letter-spacing:-.04em;
    opacity:0;
    animation: loaderNameIn .7s ease .35s forwards;
}
.loader-name span { color:#777; }
.loader-line {
    width:100%;
    height:1px;
    margin-top:26px;
    overflow:hidden;
    background:rgba(255,255,255,.1);
}
.loader-line span {
    display:block;
    width:0;
    height:100%;
    background:#fff;
    animation:loaderLine 1.1s cubic-bezier(.2,.8,.2,1) .2s forwards;
}
.loader-status {
    margin-top:13px;
    color:#555;
    font-size:9px;
    font-weight:700;
    letter-spacing:.22em;
    opacity:0;
    animation:loaderStatus .6s ease .6s forwards;
}

@keyframes loaderMarkIn {
    from { opacity:0; transform:translateY(20px) scale(.8) rotate(-8deg); }
    to { opacity:1; transform:translateY(0) scale(1) rotate(0); }
}
@keyframes loaderNameIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
}
@keyframes loaderLine { from { width:0; } to { width:100%; } }
@keyframes loaderStatus {
    from { opacity:0; transform:translateY(5px); }
    to { opacity:1; transform:translateY(0); }
}

/* Hero */
.hero-animate {
    opacity:0;
    animation:heroElementIn .85s cubic-bezier(.2,.8,.2,1) var(--hero-delay) forwards;
}
@keyframes heroElementIn {
    from { opacity:0; transform:translateY(25px); filter:blur(7px); }
    to { opacity:1; transform:translateY(0); filter:blur(0); }
}

/* Reveal */
.reveal.visible {
    animation:revealSoft .8s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes revealSoft {
    from { opacity:0; transform:translateY(28px); filter:blur(5px); }
    to { opacity:1; transform:translateY(0); filter:blur(0); }
}

/* Cards — preserve their normal transform until JS applies tilt */
.project-card,
.skill-card {
    --rx:0deg;
    --ry:0deg;
    will-change:transform;
}
.project-card.tilting,
.skill-card.tilting {
    transition:border-color .25s ease, background .25s ease, box-shadow .25s ease;
}
.project-card.tilting {
    transform:perspective(1200px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px);
}
.skill-card.tilting {
    transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(-5px);
}

/* Buttons */
.magnetic {
    --mx:0px;
    --my:0px;
    transform:translate(var(--mx),var(--my));
    will-change:transform;
}
.magnetic.clicked,
.project-link.clicked,
.btn.clicked,
.github-button.clicked {
    animation:buttonClick .45s ease;
}
@keyframes buttonClick {
    0% { scale:1; }
    45% { scale:.95; }
    100% { scale:1; }
}

/* Shine */
.btn,.github-button,.project-link { position:relative; overflow:hidden; }
.btn::after,.github-button::after,.project-link::after {
    content:"";
    position:absolute;
    top:0; left:-120%;
    width:70%; height:100%;
    transform:skewX(-18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
    transition:left .7s ease;
    pointer-events:none;
}
.btn:hover::after,.github-button:hover::after,.project-link:hover::after { left:140%; }

/* Socials */
.hero-socials a,.footer-right a {
    transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s ease,background .3s ease;
}
.hero-socials a.social-hover,.footer-right a.social-hover {
    transform:translateY(-4px) scale(1.05);
}
.hero-socials a i,.footer-right a i { transition:transform .3s ease; }
.hero-socials a:hover i,.footer-right a:hover i {
    transform:scale(1.12) rotate(-4deg);
}

/* Project icon */
.project-icon { overflow:hidden; transition:transform .4s cubic-bezier(.2,.8,.2,1); }
.project-card:hover .project-icon { transform:translateY(-3px) rotate(-3deg); }

/* Contact arrow */
.contact-arrow { transition:transform .35s cubic-bezier(.2,.8,.2,1); }
.contact-card:hover .contact-arrow { transform:translate(4px,-4px); }

/* Progress glow */
.scroll-progress {
    transform-origin:left center;
    box-shadow:0 0 10px rgba(255,255,255,.7),0 0 25px rgba(255,255,255,.18);
}

/* Cursor */
.cursor-glow { pointer-events:none; }

/* Mobile */
@media (max-width:767px) {
    .cursor-glow { display:none !important; }
    .project-card.tilting,
    .skill-card.tilting { transform:none !important; }
    .magnetic { transform:none !important; }
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
        transition-duration:.01ms !important;
    }
    .project-card,.skill-card { transform:none !important; }
}

</style>
</head>

<body>


<div class="page-loader" aria-hidden="true">
  <div class="loader-inner">
    <div class="loader-mark"><span>V</span></div>
    <div class="loader-name">VaaYU<span>.</span></div>
    <div class="loader-line"><span></span></div>
    <div class="loader-status">BUILDING EXPERIENCE</div>
  </div>
</div>


<!-- =====================================================
     PASTE YOUR EXISTING BASE PORTFOLIO HTML HERE
     Keep all existing sections/content exactly as-is:
     Hero, About, Skills, Taara, Zaara, AutoMailerPro,
     Contact, social icons and footer.
===================================================== -->


<script>
document.addEventListener(
            "DOMContentLoaded",
            () => {

                /* PREMIUM PAGE LOADER */
                const pageLoader = document.querySelector(".page-loader");

                window.addEventListener("load", () => {
                    window.setTimeout(() => {
                        document.body.classList.add("page-ready");
                        if (pageLoader) pageLoader.classList.add("loaded");
                    }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 850);
                }, { once: true });




                /* =================================================
                   ELEMENTS
                ================================================== */

                const body =
                    document.body;

                const navbar =
                    document.querySelector(".navbar");

                const progress =
                    document.querySelector(
                        ".scroll-progress"
                    );

                const cursorGlow =
                    document.querySelector(
                        ".cursor-glow"
                    );

                const themeToggle =
                    document.querySelector(
                        "#themeToggle"
                    );

                const menuToggle =
                    document.querySelector(
                        "#menuToggle"
                    );

                const mobileMenu =
                    document.querySelector(
                        "#mobileMenu"
                    );

                const year =
                    document.querySelector(
                        "#year"
                    );


                /* =================================================
                   YEAR
                ================================================== */

                if (year) {

                    year.textContent =
                        new Date()
                            .getFullYear();

                }


                /* =================================================
                   NAVBAR
                ================================================== */

                function updateNavbar() {

                    if (!navbar) return;

                    navbar.classList.toggle(
                        "scrolled",
                        window.scrollY > 40
                    );

                }


                updateNavbar();


                window.addEventListener(
                    "scroll",
                    updateNavbar,
                    { passive: true }
                );


                /* =================================================
                   SCROLL PROGRESS
                ================================================== */

                function updateProgress() {

                    if (!progress) return;

                    const scrollTop =
                        window.scrollY;

                    const scrollable =
                        document.documentElement
                            .scrollHeight -
                        window.innerHeight;

                    const percentage =
                        scrollable > 0
                            ? (
                                scrollTop /
                                scrollable
                            ) * 100
                            : 0;

                    progress.style.width =
                        `${Math.min(
                            100,
                            Math.max(
                                0,
                                percentage
                            )
                        )}%`;

                }


                updateProgress();


                window.addEventListener(
                    "scroll",
                    updateProgress,
                    { passive: true }
                );


                window.addEventListener(
                    "resize",
                    updateProgress
                );


                /* =================================================
                   THEME
                ================================================== */

                const THEME_KEY =
                    "portfolio-theme";


                function applyTheme(theme) {

                    const light =
                        theme === "light";


                    body.classList.toggle(
                        "light-theme",
                        light
                    );


                    if (themeToggle) {

                        const icon =
                            themeToggle
                                .querySelector("i");


                        if (icon) {

                            icon.classList.toggle(
                                "fa-sun",
                                !light
                            );

                            icon.classList.toggle(
                                "fa-moon",
                                light
                            );

                        }


                        themeToggle.setAttribute(
                            "aria-pressed",
                            String(light)
                        );


                        themeToggle.setAttribute(
                            "aria-label",
                            light
                                ? "Switch to dark theme"
                                : "Switch to light theme"
                        );


                        themeToggle.setAttribute(
                            "title",
                            light
                                ? "Switch to dark theme"
                                : "Switch to light theme"
                        );

                    }

                }


                const savedTheme =
                    localStorage.getItem(
                        THEME_KEY
                    );


                let currentTheme =
                    savedTheme === "light"
                        ? "light"
                        : "dark";


                applyTheme(
                    currentTheme
                );


                if (themeToggle) {

                    themeToggle.addEventListener(
                        "click",
                        () => {

                            currentTheme =
                                body.classList.contains(
                                    "light-theme"
                                )
                                    ? "dark"
                                    : "light";


                            localStorage.setItem(
                                THEME_KEY,
                                currentTheme
                            );


                            applyTheme(
                                currentTheme
                            );

                        }
                    );

                }


                /* =================================================
                   MOBILE MENU
                ================================================== */

                function closeMobileMenu() {

                    if (!mobileMenu) return;

                    mobileMenu.classList.remove(
                        "open"
                    );


                    if (menuToggle) {

                        menuToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );


                        menuToggle.setAttribute(
                            "aria-label",
                            "Open menu"
                        );


                        const icon =
                            menuToggle
                                .querySelector("i");


                        if (icon) {

                            icon.classList.remove(
                                "fa-xmark"
                            );

                            icon.classList.add(
                                "fa-bars"
                            );

                        }

                    }

                }


                function openMobileMenu() {

                    if (!mobileMenu) return;

                    mobileMenu.classList.add(
                        "open"
                    );


                    if (menuToggle) {

                        menuToggle.setAttribute(
                            "aria-expanded",
                            "true"
                        );


                        menuToggle.setAttribute(
                            "aria-label",
                            "Close menu"
                        );


                        const icon =
                            menuToggle
                                .querySelector("i");


                        if (icon) {

                            icon.classList.remove(
                                "fa-bars"
                            );

                            icon.classList.add(
                                "fa-xmark"
                            );

                        }

                    }

                }


                if (menuToggle) {

                    menuToggle.addEventListener(
                        "click",
                        (event) => {

                            event.stopPropagation();


                            if (
                                mobileMenu &&
                                mobileMenu.classList.contains(
                                    "open"
                                )
                            ) {

                                closeMobileMenu();

                            } else {

                                openMobileMenu();

                            }

                        }
                    );

                }


                if (mobileMenu) {

                    mobileMenu
                        .querySelectorAll("a")
                        .forEach(
                            (link) => {

                                link.addEventListener(
                                    "click",
                                    closeMobileMenu
                                );

                            }
                        );

                }


                document.addEventListener(
                    "click",
                    (event) => {

                        if (
                            !mobileMenu ||
                            !menuToggle
                        ) {
                            return;
                        }


                        if (
                            mobileMenu.classList.contains(
                                "open"
                            ) &&
                            !mobileMenu.contains(
                                event.target
                            ) &&
                            !menuToggle.contains(
                                event.target
                            )
                        ) {

                            closeMobileMenu();

                        }

                    }
                );


                document.addEventListener(
                    "keydown",
                    (event) => {

                        if (
                            event.key === "Escape"
                        ) {

                            closeMobileMenu();

                        }

                    }
                );


                window.addEventListener(
                    "resize",
                    () => {

                        if (
                            window.innerWidth > 768
                        ) {

                            closeMobileMenu();

                        }

                    }
                );


                /* =================================================
                   REVEAL
                ================================================== */

                const revealElements =
                    document.querySelectorAll(
                        ".reveal"
                    );


                if (
                    "IntersectionObserver"
                    in window
                ) {

                    const observer =
                        new IntersectionObserver(
                            (
                                entries,
                                obs
                            ) => {

                                entries.forEach(
                                    (entry) => {

                                        if (
                                            entry.isIntersecting
                                        ) {

                                            entry.target
                                                .classList
                                                .add(
                                                    "visible"
                                                );


                                            obs.unobserve(
                                                entry.target
                                            );

                                        }

                                    }
                                );

                            },
                            {
                                threshold: .12,
                                rootMargin:
                                    "0px 0px -40px 0px"
                            }
                        );


                    revealElements.forEach(
                        (element) => {

                            observer.observe(
                                element
                            );

                        }
                    );

                } else {

                    revealElements.forEach(
                        (element) => {

                            element.classList.add(
                                "visible"
                            );

                        }
                    );

                }


                /* =================================================
                   PROJECT TILT
                ================================================== */

                const cards =
                    document.querySelectorAll(
                        ".project-card, .skill-card"
                    );


                cards.forEach(
                    (card) => {

                        card.addEventListener(
                            "mousemove",
                            (event) => {

                                if (
                                    window.innerWidth <
                                    768
                                ) {
                                    return;
                                }


                                const rect =
                                    card.getBoundingClientRect();


                                const x =
                                    (
                                        event.clientX -
                                        rect.left
                                    ) / rect.width;


                                const y =
                                    (
                                        event.clientY -
                                        rect.top
                                    ) / rect.height;


                                const rotateX =
                                    (
                                        .5 - y
                                    ) * 3;


                                const rotateY =
                                    (
                                        x - .5
                                    ) * 3;


                                card.classList.add("tilting");

                                card.style.transform =
                                    `
                                    perspective(1100px)
                                    rotateX(${rotateX}deg)
                                    rotateY(${rotateY}deg)
                                    translateY(-4px)
                                    `;

                            }
                        );


                        card.addEventListener(
                            "mouseleave",
                            () => {

                                card.style.transform =
                                    "";
                                card.classList.remove("tilting");

                            }
                        );

                    }
                );


                /* =================================================
                   MAGNETIC BUTTONS
                ================================================== */

                const magnetic =
                    document.querySelectorAll(
                        ".magnetic"
                    );


                magnetic.forEach(
                    (element) => {

                        element.addEventListener(
                            "mousemove",
                            (event) => {

                                if (
                                    window.innerWidth <
                                    768
                                ) {
                                    return;
                                }


                                const rect =
                                    element
                                        .getBoundingClientRect();


                                const x =
                                    event.clientX -
                                    (
                                        rect.left +
                                        rect.width / 2
                                    );


                                const y =
                                    event.clientY -
                                    (
                                        rect.top +
                                        rect.height / 2
                                    );


                                element.style.transform =
                                    `
                                    translate(
                                        ${x * .06}px,
                                        ${y * .06}px
                                    )
                                    `;

                            }
                        );


                        element.addEventListener(
                            "mouseleave",
                            () => {

                                element.style.transform =
                                    "";

                            }
                        );

                    }
                );


                /* =================================================
                   CURSOR GLOW
                ================================================== */

                if (
                    cursorGlow &&
                    window.matchMedia(
                        "(pointer: fine)"
                    ).matches
                ) {

                    let x =
                        window.innerWidth / 2;

                    let y =
                        window.innerHeight / 2;


                    let targetX =
                        x;

                    let targetY =
                        y;


                    window.addEventListener(
                        "mousemove",
                        (event) => {

                            targetX =
                                event.clientX;

                            targetY =
                                event.clientY;

                        },
                        { passive: true }
                    );


                    function animateGlow() {

                        x +=
                            (
                                targetX - x
                            ) * .1;


                        y +=
                            (
                                targetY - y
                            ) * .1;


                        cursorGlow.style.left =
                            `${x}px`;

                        cursorGlow.style.top =
                            `${y}px`;


                        requestAnimationFrame(
                            animateGlow
                        );

                    }


                    animateGlow();

                }


                /* =================================================
                   SMOOTH ANCHORS
                ================================================== */

                document
                    .querySelectorAll(
                        'a[href^="#"]'
                    )
                    .forEach(
                        (link) => {

                            link.addEventListener(
                                "click",
                                (event) => {

                                    const id =
                                        link.getAttribute(
                                            "href"
                                        );


                                    if (
                                        !id ||
                                        id === "#"
                                    ) {
                                        return;
                                    }


                                    const target =
                                        document.querySelector(
                                            id
                                        );


                                    if (!target) {
                                        return;
                                    }


                                    event.preventDefault();


                                    const navbarHeight =
                                        navbar
                                            ? navbar
                                                .offsetHeight
                                            : 0;


                                    const top =
                                        target
                                            .getBoundingClientRect()
                                            .top +
                                        window.scrollY -
                                        navbarHeight -
                                        10;


                                    window.scrollTo({
                                        top,
                                        behavior:
                                            "smooth"
                                    });

                                }
                            );

                        }
                    );


                /* =================================================
                   EXTERNAL LINK SECURITY
                ================================================== */

                document
                    .querySelectorAll(
                        'a[target="_blank"]'
                    )
                    .forEach(
                        (link) => {

                            link.setAttribute(
                                "rel",
                                "noopener noreferrer"
                            );

                        }
                    );


            }
        );

</script>

</body>
</html>
